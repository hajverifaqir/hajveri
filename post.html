<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Post | Your Name</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0b0f19;
      --bg-card: #131a2a;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --accent: #6366f1;
      --accent-secondary: #10b981;
      --nav-bg: rgba(11, 15, 25, 0.85);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --bg-card: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --accent: #4f46e5;
      --accent-secondary: #059669;
      --nav-bg: rgba(248, 250, 252, 0.85);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.75;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1.25;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 70px;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back-link {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--accent);
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    main {
      padding: 4rem 0 5rem;
    }

    .article-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
    }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.85rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .blog-category {
      color: var(--accent-secondary);
      font-weight: 600;
      background: rgba(16, 185, 129, 0.12);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
    }

    .article-card h1 {
      font-size: clamp(1.85rem, 4vw, 2.5rem);
      margin-bottom: 1.5rem;
    }

    .article-content p {
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      font-size: 1.03rem;
    }

    .article-content h2 {
      font-size: 1.35rem;
      margin: 2rem 0 0.75rem;
      color: var(--text);
    }

    .article-content ul {
      margin: 0.75rem 0 1.5rem 1.25rem;
      color: var(--text-muted);
    }

    .article-content li {
      margin-bottom: 0.5rem;
    }

    .callout {
      background: var(--bg);
      border-left: 4px solid var(--accent);
      padding: 1rem 1.25rem;
      border-radius: 0 10px 10px 0;
      margin: 1.5rem 0;
      color: var(--text);
      font-size: 0.96rem;
    }

    .post-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.7rem 1.2rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      background: var(--bg);
      border: 1px solid var(--border);
      transition: border-color 0.2s, transform 0.2s;
    }

    .btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .article-card {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-inner">
      <a href="index.html" class="logo">&lt;<span>DevStudio</span> /&gt;</a>
      <div class="nav-right">
        <a href="index.html#blog" class="back-link">&larr; All Blog Posts</a>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle Dark/Light Mode" title="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <article class="article-card" id="articleContainer"></article>
  </main>

  <footer>
    <div class="container">
      <p>&copy; <span id="year"></span> Your Name. Hosted on GitHub Pages.</p>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Sync theme with main page
    const htmlEl = document.documentElement;
    const savedTheme = localStorage.getItem('theme') || 'dark';
    htmlEl.setAttribute('data-theme', savedTheme);

    document.getElementById('themeToggle').addEventListener('click', () => {
      const next = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      htmlEl.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    // Blog Posts Data
    const posts = {
      'game-controls': {
        category: 'Game Dev',
        date: 'Nov 2026',
        readTime: '3 min read',
        title: 'Building Smooth 60 FPS Touch Controls for Mobile Games',
        content: `
          <p>When I started prototyping the SkyPilot aeroplane game, my first mistake was tying movement directly to frame counts instead of elapsed delta-time. On 120Hz mobile screens, the plane fell twice as fast as on 60Hz monitors.</p>
          <h2>1. Normalize Physics with Delta-Time</h2>
          <p>By scaling gravity and horizontal obstacle speed against elapsed milliseconds per frame, gameplay stays identical across high-refresh-rate Android phones and standard desktop browsers.</p>
          <h2>2. Forgiving Hitboxes Feel Fairer</h2>
          <p>Nothing frustrates mobile players faster than losing when a wing barely grazes empty air near a corner. Shrinking the collision radius by 2–3 pixels compared to the visual sprite makes the game feel crisp and fair.</p>
          <div class="callout">
            <strong>Next Milestone:</strong> Porting the core SkyPilot loop to Unity with parallax city layers, sound effects, and Google Play Games leaderboards.
          </div>
        `
      },
      'pocketcalc-ui': {
        category: 'Mobile Apps',
        date: 'Oct 2026',
        readTime: '4 min read',
        title: 'Designing PocketCalc: Clean UI & Safe Math Parsing',
        content: `
          <p>Utility apps like calculators live or die by speed and reliability. Users expect instant response on every tap, clear expression history, and zero crashes on edge cases like dividing by zero or double decimals.</p>
          <h2>Why Avoid Naive Expression Evaluation?</h2>
          <p>Instead of relying on unsafe evaluation functions, PocketCalc uses a lightweight Shunting-Yard parser. It tokenizes numbers and operators cleanly and respects math order of operations (multiplication and division before addition and subtraction).</p>
          <h2>Mobile Ergonomics</h2>
          <ul>
            <li>Large touch targets (minimum 48dp) prevent thumb typos.</li>
            <li>Color-coded operator keys separate numbers from actions at a glance.</li>
            <li>Live expression history lets you double-check numbers without retyping.</li>
          </ul>
        `
      },
      'google-play-checklist': {
        category: 'Publishing',
        date: 'Sep 2026',
        readTime: '5 min read',
        title: 'My Checklist Before Releasing on Google Play',
        content: `
          <p>Shipping an Android app or game involves more than writing clean code. Before uploading your first release to the Google Play Console, running through a structured checklist saves days of review delays.</p>
          <h2>Pre-Launch Essentials</h2>
          <ul>
            <li><strong>Android App Bundle (.aab):</strong> Always build a signed release AAB targeting the latest Android API level.</li>
            <li><strong>Store Graphics:</strong> Prepare a 512&times;512 app icon, a 1024&times;500 feature graphic, and at least 4 phone screenshots.</li>
            <li><strong>Privacy Policy URL:</strong> Even offline apps and games need a valid Privacy Policy URL—hosting a simple <code>privacy.html</code> right inside this GitHub Pages repo is free and reliable.</li>
            <li><strong>Closed Testing:</strong> Test on real physical devices with different screen ratios before pushing to production.</li>
          </ul>
          <div class="callout">
            <strong>Pro Tip:</strong> Link your Google Play Developer page directly from your GitHub Pages portfolio so players can discover all your releases in one place.
          </div>
        `
      }
    };

    const keys = Object.keys(posts);
    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id');
    const post = posts[postId];
    const container = document.getElementById('articleContainer');

    if (!post) {
      document.title = 'Article Not Found | Your Name';
      container.innerHTML = `
        <h1>Article Not Found</h1>
        <p style="color: var(--text-muted); margin: 1rem 0 1.5rem;">The blog post you are looking for does not exist or has been moved.</p>
        <a href="index.html#blog" class="btn btn-primary">&larr; Back to Blog</a>
      `;
    } else {
      document.title = `${post.title} | Your Name`;
      const idx = keys.indexOf(postId);
      const prevKey = idx > 0 ? keys[idx - 1] : null;
      const nextKey = idx < keys.length - 1 ? keys[idx + 1] : null;

      container.innerHTML = `
        <div class="article-meta">
          <span class="blog-category">${post.category}</span>
          <span>${post.date} &bull; ${post.readTime}</span>
        </div>
        <h1>${post.title}</h1>
        <div class="article-content">
          ${post.content}
        </div>
        <div class="post-nav">
          ${prevKey ? `<a href="post.html?id=${prevKey}" class="btn">&larr; Previous Post</a>` : `<a href="index.html#blog" class="btn">&larr; Back to Home</a>`}
          ${nextKey ? `<a href="post.html?id=${nextKey}" class="btn btn-primary">Next Post &rarr;</a>` : `<a href="index.html#playground" class="btn btn-primary">Try Live Demos &rarr;</a>`}
        </div>
      `;
    }
  </script>
</body>
</html>
